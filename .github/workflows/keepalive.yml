# ═══════════════════════════════════════════════════════════════
#  KEEPALIVE — Prevents Render free-tier from sleeping
#
#  Render free web services sleep after 15 min of no requests.
#  This pings /ping every 14 min to keep the scraper alive 24/7.
#
#  Budget: ~103 runs/day × 0.1 min = ~10 min/day = ~300 min/month
#  Combined with full sweep (~2,880): total ~3,180 min/month
#  ⚠️ Exceeds 2,000 free min — see notes below for solutions.
#
#  SOLUTIONS TO STAY WITHIN FREE TIER:
#  Option 1: Use UptimeRobot (free, 5-min pings) instead of this workflow
#            → Sign up at uptimerobot.com, add HTTP monitor for your Render URL
#            → Delete this workflow file entirely
#  Option 2: Reduce full sweep frequency to every 2 hours
#            → Change scrape-and-deploy.yml cron to '20 */2 * * *'
#            → Saves ~1,440 min/month → total fits in free tier
#  Option 3: Keep this workflow but only during work hours
#            → Already configured below with business-hours cron
# ═══════════════════════════════════════════════════════════════

name: "💓 Keepalive"

on:
  schedule:
    # Every 14 min during US business hours (8 AM - 11 PM CT = 14:00 - 05:00 UTC)
    # This is a compromise: keeps Render alive when you're likely checking,
    # sleeps during off-hours to save Actions minutes.
    - cron: '*/14 14-23 * * *'    # 14:00-23:59 UTC (8 AM - 5:59 PM CT)
    - cron: '*/14 0-4 * * *'      # 00:00-04:59 UTC (6 PM - 10:59 PM CT)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: "💓 Ping Render"
        run: |
          URL="${{ secrets.RENDER_URL }}"
          if [ -z "$URL" ]; then
            echo "⚠️ RENDER_URL secret not set — skipping"
            echo "Set it in: Settings → Secrets → Actions → New secret"
            echo "Value: https://jobscout-api.onrender.com (your Render URL)"
            exit 0
          fi
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$URL/ping")
          echo "Ping response: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "⚠️ Render may be starting up (cold start takes ~30s)"
          fi
