# ═══════════════════════════════════════════════════════════════
#  FULL SWEEP — runs hourly via GitHub Actions
#
#  This is the "deep scan" component of Option D:
#  • Scrapes ALL 109 companies (with tier batching)
#  • Exports fresh api-data.json (static fallback for dashboard)
#  • Commits + deploys dashboard to GitHub Pages
#  • Optionally pings Render to refresh its cache
#
#  Budget: 24 runs/day × ~4 min = 96 min/day ≈ 2,880 min/month
#  (GitHub free = 2,000 min — adjust to every 90 min if needed)
# ═══════════════════════════════════════════════════════════════

name: "🔍 Full Sweep & Deploy"

on:
  schedule:
    - cron: '20 */2 * * *'        # Every hour at :20
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "scrape-deploy"
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install deps
        run: pip install -r backend/requirements.txt

      # Restore DB + cycle counter from previous run
      - name: Restore state
        uses: actions/download-artifact@v4
        with:
          name: jobscout-state
          path: backend/
        continue-on-error: true

      # Full scrape — all tiers eligible this cycle
      - name: "🔍 Scrape all boards"
        working-directory: backend
        run: python main.py --delay 0.3
        env:
          DB_PATH: jobscout.db

      - name: "📊 Print stats"
        working-directory: backend
        run: python main.py --stats --db jobscout.db

      # Persist state for next run
      - name: Save state
        uses: actions/upload-artifact@v4
        with:
          name: jobscout-state
          path: |
            backend/jobscout.db
            backend/.cycle_counter
          retention-days: 90
          overwrite: true

      # Commit updated api-data.json
      - name: "📤 Commit data"
        run: |
          git config user.name "JobScout Bot"
          git config user.email "bot@jobscout.dev"
          git add frontend/public/api-data.json
          git diff --cached --quiet || {
            JOBS=$(python3 -c "import json;d=json.load(open('frontend/public/api-data.json'));print(d['stats']['total_jobs'])")
            git commit -m "data: ${JOBS} jobs · $(date -u +'%b %d %H:%M') UTC [skip ci]"
            git push
          }

      # Optional: Ping Render to refresh its cache
      # Uncomment and set RENDER_URL secret after deploying to Render
      # - name: "🔔 Notify Render"
      #   run: |
      #     curl -s -X POST "${{ secrets.RENDER_URL }}/api/scrape" \
      #       -H "Authorization: Bearer ${{ secrets.API_SECRET }}" \
      #       --max-time 10 || true

  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Pull latest data
        run: git pull origin main || true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: "🏗️ Build dashboard"
        working-directory: frontend
        run: npm ci || npm install && npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - id: deployment
        uses: actions/deploy-pages@v4
