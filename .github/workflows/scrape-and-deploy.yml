# ═══════════════════════════════════════════════════════════════
#  FULL SWEEP — scrapes all companies, exports JSON, deploys Pages
#
#  Schedule: Every 2 hours, skipping quiet hours (12am–5:30am CST)
#            12am–5:30am CST = 06:00–11:30 UTC → skip hours 6, 8, 10 UTC
#
#  Manual run: Go to Actions tab → "Full Sweep & Deploy" → "Run workflow"
#              Pick "full" (all companies) or "fast" (Tier 1 only, ~30s)
#
#  Budget: 9 runs/day × ~4 min = ~36 min/day ≈ 1,080 min/month
#          (well within GitHub free tier of 2,000 min/month)
# ═══════════════════════════════════════════════════════════════

name: "🔍 Full Sweep & Deploy"

on:
  schedule:
    # Every 2 hours at :20, but skip quiet hours (06:00–11:30 UTC = 12am–5:30am CST)
    # Runs at: 00:20, 02:20, 04:20, 12:20, 14:20, 16:20, 18:20, 20:20, 22:20 UTC
    - cron: '20 0,2,4,12,14,16,18,20,22 * * *'

  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'

  # Manual trigger with mode selection
  workflow_dispatch:
    inputs:
      mode:
        description: 'Scrape mode'
        required: false
        default: 'full'
        type: choice
        options:
          - full    # All companies (~3 min)
          - fast    # Tier 1 only, 24 companies (~30 sec)

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "scrape-deploy"
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install deps
        run: pip install -r backend/requirements.txt

      # Restore DB + cycle counter from previous run
      - name: Restore state
        uses: actions/download-artifact@v4
        with:
          name: jobscout-state
          path: backend/
        continue-on-error: true

      # Scrape — respects manual mode input or defaults to full
      - name: "🔍 Scrape all boards"
        working-directory: backend
        run: |
          MODE="${{ github.event.inputs.mode || 'full' }}"
          echo "Running in mode: $MODE"
          if [ "$MODE" = "fast" ]; then
            python main.py --fast --delay 0.3
          else
            python main.py --delay 0.3
          fi
        env:
          DB_PATH: jobscout.db

      - name: "📊 Print stats"
        working-directory: backend
        run: python main.py --stats --db jobscout.db

      # Persist state for next run (90-day retention)
      - name: Save state
        uses: actions/upload-artifact@v4
        with:
          name: jobscout-state
          path: |
            backend/jobscout.db
            backend/.cycle_counter
          retention-days: 90
          overwrite: true

      # Commit updated api-data.json to repo
      - name: "📤 Commit data"
        run: |
          git config user.name "JobScout Bot"
          git config user.email "bot@jobscout.dev"
          git add frontend/public/api-data.json
          git diff --cached --quiet || {
            JOBS=$(python3 -c "import json;d=json.load(open('frontend/public/api-data.json'));print(d['stats']['total_jobs'])" 2>/dev/null || echo "?")
            git commit -m "data: ${JOBS} jobs · $(date -u +'%b %d %H:%M') UTC [skip ci]"
            git push
          }

      # Optional: Ping Render to refresh its cache after GitHub Actions scrape
      # Uncomment after deploying to Render and setting RENDER_URL + API_SECRET secrets
      # - name: "🔔 Notify Render"
      #   run: |
      #     curl -s -X POST "${{ secrets.RENDER_URL }}/api/scrape" \
      #       -H "Authorization: Bearer ${{ secrets.API_SECRET }}" \
      #       -H "Content-Type: application/json" \
      #       --max-time 10 || true

  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Pull latest data
        run: git pull origin main || true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: "🏗️ Build dashboard"
        working-directory: frontend
        run: npm ci || npm install && npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - id: deployment
        uses: actions/deploy-pages@v4
