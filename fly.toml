app = "job-scout"
primary_region = "dfw"

[build]
  dockerfile = "Dockerfile"

[env]
  HEALTH_PORT = "8089"
  SCRAPE_INTERVAL = "30"
  PRIORITY_FILTER = "2"
  LOG_LEVEL = "INFO"

[http_service]
  internal_port = 8089
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[mounts]
  source = "scout_data"
  destination = "/home/scout/.job_scout"
