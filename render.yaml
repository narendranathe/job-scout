services:
  - type: web
    name: jobscout-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /ping
    envVars:
      - key: DB_PATH
        value: /app/data/jobscout.db
      - key: FAST_INTERVAL
        value: "300"
      - key: SCRAPE_DELAY
        value: "0.3"